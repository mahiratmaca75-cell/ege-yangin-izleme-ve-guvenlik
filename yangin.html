<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ege Aktif Yangın & Termal Risk İzleme Paneli</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #0b1120; color: #f8fafc; }
    header { background: #0f172a; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
    .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 20px; }
    .kpi-kart { background: #1e293b; padding: 18px; border-radius: 10px; border-left: 4px solid #ef4444; }
    .kpi-kart.mavi { border-left-color: #38bdf8; }
    .kpi-kart.sari { border-left-color: #f59e0b; }
    .kpi-baslik { font-size: 13px; color: #94a3b8; font-weight: 500; }
    .kpi-deger { font-size: 26px; font-weight: bold; margin-top: 6px; color: #f8fafc; }
    .kontrol-paneli { display: flex; gap: 15px; align-items: center; padding: 0 20px 15px 20px; }
    button { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background: #2563eb; color: white; }
    button:hover { background: #1d4ed8; }
    .icerik { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 20px; padding: 0 20px 25px 20px; }
    .panel-kutu { background: #1e293b; padding: 18px; border-radius: 10px; border: 1px solid #334155; }
    
    /* Ege Radar Izgarası */
    #radar-alani { width: 100%; height: 500px; background: #020617; border-radius: 8px; position: relative; overflow: hidden; border: 1px solid #1e293b; background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 30px 30px; }
    
    /* Radar Noktaları */
    .istasyon-nokta { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .nokta-isaret { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #ffffff; box-shadow: 0 0 10px currentColor; position: relative; }
    .nokta-isaret::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid currentColor; opacity: 0.4; animation: pulse 1.8s infinite; }
    @keyframes pulse { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(1.6); opacity: 0; } }
    .nokta-yazi { font-size: 11px; font-weight: 700; white-space: nowrap; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
    th, td { border-bottom: 1px solid #334155; padding: 10px 8px; text-align: left; }
    th { background: #0f172a; color: #94a3b8; }
    .durum-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .risk-kritik { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .risk-izleme { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    
    .bar-grup { margin-top: 15px; display: flex; flex-direction: column; gap: 12px; }
    .bar-satir { display: flex; flex-direction: column; gap: 4px; }
    .bar-etiket { font-size: 12px; display: flex; justify-content: space-between; color: #cbd5e1; }
    .bar-ray { background: #0f172a; height: 12px; border-radius: 6px; overflow: hidden; }
    .bar-dolgu { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
    
    @media (max-width: 900px) { .icerik { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <header>
    <div style="font-size: 19px; font-weight: 700;">🔥 Ege Aktif Yangın & Termal Risk İzleme Paneli</div>
    <div id="son-guncelleme" style="font-size: 13px; color: #38bdf8;">Senkronize ediliyor...</div>
  </header>

  <div class="kpi-container">
    <div class="kpi-kart">
      <div class="kpi-baslik">İzlenen Kritik Ege İstasyonları</div>
      <div class="kpi-deger" id="kpi-toplam">7 İstasyon</div>
    </div>
    <div class="kpi-kart mavi">
      <div class="kpi-baslik">Bölge Ortalama Rüzgârı</div>
      <div class="kpi-deger" id="kpi-ruzgar">0 km/s</div>
